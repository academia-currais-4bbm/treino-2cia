<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Posição inicial — padrão Treino 2ª CIA</title>
  <desc id="desc">Guia visual padronizado enquanto a mídia específica do exercício não está cadastrada.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%"><stop stop-color="#241012"/><stop offset=".58" stop-color="#0c0d0e"/><stop offset="1" stop-color="#050505"/></radialGradient>
    <linearGradient id="red" x1="0" x2="1"><stop stop-color="#d90f18"/><stop offset="1" stop-color="#ff2730"/></linearGradient>
  </defs>
  <rect width="720" height="720" rx="34" fill="url(#bg)"/>
  <rect x="26" y="26" width="668" height="668" rx="28" fill="none" stroke="#3b3b3b" stroke-width="2"/>
  <rect x="48" y="46" width="190" height="40" rx="10" fill="#0b0b0b" stroke="#e51a23"/>
  <text x="143" y="73" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">POSIÇÃO INICIAL</text>
  <g transform="translate(242 150)" fill="#9a9da2" opacity=".96">
    <circle cx="118" cy="70" r="42"/>
    <rect x="78" y="116" width="80" height="170" rx="35"/>
    <rect x="32" y="128" width="28" height="170" rx="14" transform="rotate(8 46 213)"/>
    <rect x="176" y="128" width="28" height="170" rx="14" transform="rotate(-8 190 213)"/>
    <rect x="82" y="274" width="30" height="175" rx="15" transform="rotate(3 97 360)"/>
    <rect x="124" y="274" width="30" height="175" rx="15" transform="rotate(-3 139 360)"/>
  </g>
  <ellipse cx="330" cy="325" rx="45" ry="30" fill="url(#red)" opacity=".95"/>
  <ellipse cx="390" cy="325" rx="45" ry="30" fill="url(#red)" opacity=".95"/>
  <text x="360" y="626" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">GUIA VISUAL PADRONIZADO</text>
  <text x="360" y="660" text-anchor="middle" fill="#ef2630" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">TREINO 2ª CIA</text>
</svg>
